[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpsweep"
version = "0.2.0"
description = "Discovery and fingerprinting scanner for MCP-over-HTTP servers (tool enumeration + risk heuristics)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "mcpsweep contributors" }]
keywords = ["mcp", "model-context-protocol", "security", "scanner", "discovery", "recon", "llm", "appsec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Internet",
]
dependencies = []  # stdlib only

[project.urls]
Homepage = "https://github.com/krishnareddypadala/mcpsweep"
Issues = "https://github.com/krishnareddypadala/mcpsweep/issues"

[project.scripts]
mcpsweep = "mcpsweep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
