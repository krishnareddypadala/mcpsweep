name: Release

# Automated releases via release-please + PyPI Trusted Publishing.
#
# Flow:
#   1. Land commits on master using Conventional Commits (feat:, fix:, …).
#   2. release-please opens/updates a "release PR" that bumps the version and
#      updates CHANGELOG.md.
#   3. Merging that PR creates a GitHub release + tag, and this same run then
#      builds, tests and publishes to PyPI (no token stored — OIDC).
#
# One-time PyPI setup (https://pypi.org/manage/account/publishing/):
#   project mcpsweep · owner krishnareddypadala · repo mcpsweep
#   workflow release.yml · environment pypi

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcpsweep/
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" build
      - name: Test
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
