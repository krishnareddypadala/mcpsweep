name: Publish to PyPI

# Publishes on every version tag (e.g. v0.2.1) using PyPI Trusted Publishing
# (OIDC) — no API token is stored in the repo. One-time setup required on PyPI:
# project mcpsweep -> Publishing -> add a GitHub publisher with
#   owner: krishnareddypadala   repo: mcpsweep
#   workflow: publish.yml        environment: pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" build
      - name: Test
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcpsweep/
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
